<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body { font-family: system-ui, sans-serif; margin: 12px; min-width: 220px; color: #111; }
  label.row { display: flex; align-items: center; gap: 8px; font-size: 14px; cursor: pointer; }
  input { width: 16px; height: 16px; }
  p.hint { font-size: 12px; color: #555; margin: 8px 0 0; }
</style>
</head>
<body>
  <label class="row">
    <input type="checkbox" id="enabled" checked>
    <span>Restore original titles</span>
  </label>
  <p class="hint">Turning it off stops future fixes. Reload the YouTube tab to bring translated titles back.</p>
  <script src="popup.js"></script>
</body>
</html>
